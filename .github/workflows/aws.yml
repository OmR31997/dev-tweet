name: EC2 Deployment Using CI/CD Pipeline
on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: 24
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  NODE_OPTIONS: --no-deprecation

jobs:
  ci:
    name: Continuous Integration (Testing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: backend

      - name: Run tests
        run: npm test
        working-directory: backend

  cd:
    name: Continuous Deployment (Deployment)
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Set up SSH-Key Pair
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            export APP_NAME="${{ secrets.APP_NAME }}"
            export APP_DIR="$HOME/projects/${{secrets.APP_NAME}}"
            export BRANCH_NAME="${{ github.ref_name }}"
            bash "$APP_DIR/backend/scripts/deploy.sh"
          EOF
