<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <title>DevTweet Hub — Developer community feed &amp; DMs</title>
    <meta
      name="description"
      content="DevTweet Hub is a calm space for developers: share updates, snippets, and links in a Twitter-style feed, follow peers, and message your cohort."
    />
    <meta
      name="keywords"
      content="DevTweet Hub, developers, community, feed, posts, engineering, campus, DMs, social"
    />
    <meta name="author" content="DevTweet Hub" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#facc15" />
    <meta name="color-scheme" content="light" />

    <!-- Canonical & social URLs: set VITE_SITE_URL in .env (see .env.example). %SITE_URL% is replaced by Vite at dev/build time. -->
    <link rel="canonical" href="%SITE_URL%/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DevTweet Hub" />
    <meta property="og:title" content="DevTweet Hub — Developer community feed &amp; DMs" />
    <meta
      property="og:description"
      content="Share builds, blog links, and hot takes with your cohort. Yellow, black &amp; white — campus energy for engineers."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="%SITE_URL%/favicon.svg" />
    <meta property="og:image:alt" content="DevTweet Hub logo" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DevTweet Hub — Developer community feed &amp; DMs" />
    <meta
      name="twitter:description"
      content="Share builds, blog links, and hot takes with your cohort. Feed, profiles, and DMs for developers."
    />
    <meta name="twitter:image" content="%SITE_URL%/favicon.svg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "DevTweet Hub",
        "alternateName": "DevTweetHub",
        "description": "Developer community platform with a Twitter-style feed, profiles, and direct messages.",
        "url": "%SITE_URL%/",
        "inLanguage": "en"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
